{% extends 'base.html' %}

{% block title %}404 - Page Not Found | Abhi Verma{% endblock %}

{% block content %}
<section class="section-padding text-center">
  <div class="container">
    <div class="custom-card p-5 mx-auto" style="max-width: 600px;">
      <h1 class="display-1 font-bold text-gradient mb-2">404</h1>
      <h3 class="text-white font-bold mb-3">Page Not Found</h3>
      <p class="text-secondary-custom mb-4">
        The requested page could not be located or has been relocated.
      </p>
      <a href="{{ url_for('main.index') }}" class="btn-custom-primary">
        <i class="fas fa-home me-2"></i> Return to Homepage
      </a>
    </div>
  </div>
</section>
{% endblock %}
