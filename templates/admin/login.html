{% extends 'base.html' %}

{% block title %}Admin Login | Abhi Verma Portfolio{% endblock %}

{% block content %}
<section class="section-padding">
  <div class="container">
    <div class="custom-card p-4 p-md-5 mx-auto border-glow" style="max-width: 480px;">
      <div class="text-center mb-4">
        <div class="logo-badge mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.4rem;">
          <i class="fas fa-lock"></i>
        </div>
        <h3 class="font-bold text-white mb-1">Admin Portal</h3>
        <p class="text-secondary-custom small">Sign in to manage projects, blogs, certificates, and inquiries.</p>
      </div>

      <form method="POST" action="{{ url_for('admin.login') }}">
        <div class="mb-3">
          <label for="username" class="form-label small text-muted-custom font-bold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-10 border-secondary text-muted-custom"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control bg-secondary bg-opacity-10 border-secondary text-white shadow-none" id="username" name="username" placeholder="admin" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small text-muted-custom font-bold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-10 border-secondary text-muted-custom"><i class="fas fa-key"></i></span>
            <input type="password" class="form-control bg-secondary bg-opacity-10 border-secondary text-white shadow-none" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="p-3 bg-secondary bg-opacity-10 rounded-3 mb-4 small text-muted-custom">
          <i class="fas fa-info-circle text-info me-1"></i> Default credentials: <strong>admin</strong> / <strong>admin123</strong>
        </div>

        <button type="submit" class="btn-custom-primary w-100 justify-content-center">
          <i class="fas fa-sign-in-alt"></i> Authenticate &amp; Access Dashboard
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
