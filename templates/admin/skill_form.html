{% extends 'base.html' %}

{% block title %}{{ title }} | Admin Dashboard{% endblock %}

{% block content %}
<section class="py-4 bg-glass border-bottom border-secondary border-opacity-25">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2 class="font-bold text-white mb-0">{{ title }}</h2>
        <span class="small text-muted-custom">Configure skill details and proficiency levels.</span>
      </div>
      <div>
        <a href="{{ url_for('admin.manage_skills') }}" class="btn-custom-outline btn-sm">
          <i class="fas fa-arrow-left me-1"></i> Back to Skills
        </a>
      </div>
    </div>
  </div>
</section>

<section class="section-padding">
  <div class="container">
    <div class="custom-card p-4 p-md-5 mx-auto" style="max-width: 650px;">
      <form method="POST">
        <div class="row g-4">
          <div class="col-md-8">
            <label class="form-label small text-muted-custom font-bold">Skill Name *</label>
            <input type="text" name="name" value="{{ skill.name if skill else '' }}" class="form-control bg-secondary bg-opacity-10 border-secondary text-white shadow-none" required placeholder="e.g. Scikit-learn">
          </div>

          <div class="col-md-4">
            <label class="form-label small text-muted-custom font-bold">Display Order</label>
            <input type="number" name="display_order" value="{{ skill.display_order if skill else 0 }}" class="form-control bg-secondary bg-opacity-10 border-secondary text-white shadow-none">
          </div>

          <div class="col-md-6">
            <label class="form-label small text-muted-custom font-bold">Category *</label>
            <select name="category" class="form-select bg-secondary bg-opacity-10 border-secondary text-white shadow-none" required>
              <option value="Programming Languages" {% if skill and skill.category == 'Programming Languages' %}selected{% endif %}>Programming Languages</option>
              <option value="Python & Data Science" {% if skill and skill.category == 'Python & Data Science' %}selected{% endif %}>Python &amp; Data Science</option>
              <option value="Machine Learning" {% if skill and skill.category == 'Machine Learning' %}selected{% endif %}>Machine Learning</option>
              <option value="Web Development" {% if skill and skill.category == 'Web Development' %}selected{% endif %}>Web Development</option>
              <option value="Tools & Platforms" {% if skill and skill.category == 'Tools & Platforms' %}selected{% endif %}>Tools &amp; Platforms</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label small text-muted-custom font-bold">Proficiency (0–100%) *</label>
            <input type="number" name="proficiency" min="0" max="100" value="{{ skill.proficiency if skill else 85 }}" class="form-control bg-secondary bg-opacity-10 border-secondary text-white shadow-none" required>
          </div>

          <div class="col-12">
            <label class="form-label small text-muted-custom font-bold">Font Awesome Icon Class</label>
            <input type="text" name="icon_class" value="{{ skill.icon_class if skill else 'fas fa-code' }}" class="form-control bg-secondary bg-opacity-10 border-secondary text-white shadow-none" placeholder="fab fa-python or fas fa-brain">
          </div>

          <div class="col-12 pt-3">
            <button type="submit" class="btn-custom-primary btn-lg w-100 justify-content-center">
              <i class="fas fa-save me-2"></i> Save Skill
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
