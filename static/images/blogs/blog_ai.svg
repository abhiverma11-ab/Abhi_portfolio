<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <rect x="40" y="40" width="720" height="370" rx="12" fill="#1e1b4b" stroke="url(#neon)" stroke-width="2"/>
  <text x="70" y="100" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">🚀 My Roadmap Towards AI Engineering (2024–2028)</text>
  <text x="70" y="140" fill="#cbd5e1" font-size="16">Math Foundations, Core ML Algorithms, Deep Learning &amp; Production Systems</text>
  <g transform="translate(70, 180)">
    <rect x="0" y="0" width="150" height="150" rx="10" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="75" y="60" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">1. Math &amp;</text>
    <text x="75" y="85" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Statistics</text>

    <rect x="170" y="0" width="150" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="245" y="60" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">2. Scikit-learn</text>
    <text x="245" y="85" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">&amp; Data Eng</text>

    <rect x="340" y="0" width="150" height="150" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="415" y="60" fill="#a78bfa" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">3. Deep Learning</text>
    <text x="415" y="85" fill="#a78bfa" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">&amp; RAG</text>

    <rect x="510" y="0" width="150" height="150" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <text x="585" y="60" fill="#ec4899" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">4. Full-Stack</text>
    <text x="585" y="85" fill="#ec4899" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Flask &amp; APIs</text>
  </g>
</svg>
