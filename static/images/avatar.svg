<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="avatar-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle & Neural Rings -->
  <rect width="600" height="600" rx="40" fill="url(#bg-grad)"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="url(#neon-grad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.25"/>

  <!-- Glowing Nodes -->
  <circle cx="120" cy="180" r="6" fill="#00f2fe" filter="url(#glow)"/>
  <line x1="120" y1="180" x2="220" y2="230" stroke="#00f2fe" stroke-width="1.5" opacity="0.4"/>
  <circle cx="480" cy="220" r="6" fill="#6366f1" filter="url(#glow)"/>
  <line x1="480" y1="220" x2="380" y2="250" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <circle cx="450" cy="420" r="5" fill="#4facfe" filter="url(#glow)"/>
  <line x1="450" y1="420" x2="360" y2="460" stroke="#4facfe" stroke-width="1.5" opacity="0.4"/>

  <!-- Developer Silhouette with Tech Glass Shield -->
  <g transform="translate(150, 120)">
    <!-- Base Body & Hoodie -->
    <path d="M 150 260 L 50 380 C 50 400 250 400 250 380 Z" fill="#1e293b" stroke="url(#neon-grad)" stroke-width="3"/>
    <!-- Head & Hair -->
    <ellipse cx="150" cy="180" rx="65" ry="75" fill="url(#avatar-skin)"/>
    <path d="M 85 170 C 85 110 120 90 150 90 C 180 90 215 110 215 170 C 215 150 200 120 150 120 C 100 120 85 150 85 170 Z" fill="#0f172a"/>
    <!-- Smart Cyber Glasses / HUD -->
    <rect x="100" y="160" width="100" height="30" rx="8" fill="rgba(0, 242, 254, 0.25)" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <line x1="110" y1="175" x2="140" y2="175" stroke="#00f2fe" stroke-width="2"/>
    <line x1="160" y1="175" x2="190" y2="175" stroke="#00f2fe" stroke-width="2"/>
    <!-- Collar / Hoodie Accent -->
    <path d="M 125 255 L 150 290 L 175 255" fill="none" stroke="#00f2fe" stroke-width="3"/>
  </g>

  <!-- Floating Tech Code Snippet Pill -->
  <g transform="translate(180, 500)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#0f172a" stroke="url(#neon-grad)" stroke-width="2"/>
    <text x="120" y="32" fill="#00f2fe" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">&lt;AbhiVerma /&gt; AI &amp; ML</text>
  </g>
</svg>
