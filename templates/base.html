<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Abhi Verma | CSE (AI & ML) Student &amp; AI Developer{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Portfolio of Abhi Verma - B.Tech CSE (AI & ML) student, Python Developer, and aspiring AI Engineer.{% endblock %}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Google Fonts: Inter & Outfit & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/print.css') }}" media="print">

  {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  {% include 'includes/navbar.html' %}

  <!-- Flash Messages / Alerts -->
  <div class="container mt-3">
    {% include 'includes/alerts.html' %}
  </div>

  <!-- Main Content Block -->
  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Certificate Lightbox Modal -->
  <div class="modal fade" id="certModal" tabindex="-1" aria-labelledby="certModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content custom-card border-0 p-3">
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title font-bold text-gradient" id="certModalTitle">Certificate Details</h5>
            <p class="text-muted-custom mb-0 small"><span id="certModalOrg"></span> • <span id="certModalDate"></span></p>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center p-3">
          <img id="certModalImg" src="" alt="Certificate" class="img-fluid rounded-3 border border-secondary shadow-lg mb-3" style="max-height: 520px; object-fit: contain; width: 100%;">
          <p id="certModalDesc" class="text-secondary-custom mb-0"></p>
        </div>
        <div class="modal-footer border-0 pt-0 justify-content-between">
          <button type="button" class="btn btn-custom-outline btn-sm" id="certModalPrev">
            <i class="fas fa-chevron-left me-1"></i> Previous
          </button>
          <span class="small text-muted-custom font-mono" id="certModalCounter"></span>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-custom-outline btn-sm" id="certModalNext">
              Next <i class="fas fa-chevron-right ms-1"></i>
            </button>
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  {% include 'includes/footer.html' %}

  <!-- Back to Top Button -->
  <button id="back-to-top" class="back-to-top" title="Back to top" aria-label="Back to top">
    <i class="fas fa-chevron-up"></i>
  </button>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Custom Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
