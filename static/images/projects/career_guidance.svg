<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a23"/>
      <stop offset="100%" stop-color="#0f2b38"/>
    </linearGradient>
    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#0d2b38" stroke="#134e4a" stroke-width="1.5"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="130" y="60" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">AI CAREER GUIDANCE • ML PATHWAY RECOMMENDER</text>
  <rect x="610" y="42" width="140" height="26" rx="6" fill="#14b8a6" opacity="0.2"/>
  <text x="680" y="59" fill="#2dd4bf" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MATCH ENGINE: 98%</text>

  <!-- Left: Assessment Score radar / meters -->
  <g transform="translate(30, 100)">
    <rect width="260" height="360" rx="12" fill="#09202a" stroke="#134e4a" stroke-width="1"/>
    <text x="20" y="35" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="16" font-weight="600">Student Aptitude Matrix</text>

    <!-- Bar 1 -->
    <text x="20" y="75" fill="#94a3b8" font-size="12">Mathematical &amp; Algorithmic Logic</text>
    <rect x="20" y="85" width="220" height="8" rx="4" fill="#134e4a"/>
    <rect x="20" y="85" width="205" height="8" rx="4" fill="#14b8a6"/>
    <text x="220" y="75" fill="#2dd4bf" font-size="12" font-weight="bold">94%</text>

    <!-- Bar 2 -->
    <text x="20" y="125" fill="#94a3b8" font-size="12">Python &amp; ML Modeling</text>
    <rect x="20" y="135" width="220" height="8" rx="4" fill="#134e4a"/>
    <rect x="20" y="135" width="195" height="8" rx="4" fill="#06b6d4"/>
    <text x="220" y="125" fill="#38bdf8" font-size="12" font-weight="bold">88%</text>

    <!-- Bar 3 -->
    <text x="20" y="175" fill="#94a3b8" font-size="12">Web API &amp; Cloud Deployment</text>
    <rect x="20" y="185" width="220" height="8" rx="4" fill="#134e4a"/>
    <rect x="20" y="185" width="175" height="8" rx="4" fill="#3b82f6"/>
    <text x="220" y="175" fill="#60a5fa" font-size="12" font-weight="bold">80%</text>

    <!-- Bar 4 -->
    <text x="20" y="225" fill="#94a3b8" font-size="12">Data Wrangling (Pandas/SQL)</text>
    <rect x="20" y="235" width="220" height="8" rx="4" fill="#134e4a"/>
    <rect x="20" y="235" width="198" height="8" rx="4" fill="#10b981"/>
    <text x="220" y="225" fill="#34d399" font-size="12" font-weight="bold">90%</text>

    <!-- Summary Box -->
    <rect x="20" y="270" width="220" height="70" rx="8" fill="#0f2b38" stroke="#14b8a6" stroke-width="1"/>
    <text x="30" y="295" fill="#94a3b8" font-size="11">ML Model Confidence</text>
    <text x="30" y="325" fill="#2dd4bf" font-family="'Outfit', sans-serif" font-size="22" font-weight="bold">High (Random Forest)</text>
  </g>

  <!-- Right: Recommended Career Pathway Card -->
  <g transform="translate(310, 100)">
    <rect width="460" height="360" rx="12" fill="#09202a" stroke="#134e4a" stroke-width="1.5"/>

    <!-- Match 1 -->
    <rect x="20" y="25" width="420" height="95" rx="10" fill="#0f2b38" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="40" y="55" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="17" font-weight="bold">1. AI / Machine Learning Engineer</text>
    <text x="40" y="78" fill="#2dd4bf" font-size="13" font-weight="600">Match Score: 95.4% • Highest Alignment</text>
    <text x="40" y="100" fill="#94a3b8" font-size="12">Next Steps: PyTorch, Transformers &amp; Model Deployment (Flask/FastAPI)</text>
    <circle cx="410" cy="55" r="16" fill="#14b8a6"/>
    <text x="410" y="60" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">★</text>

    <!-- Match 2 -->
    <rect x="20" y="135" width="420" height="95" rx="10" fill="#0f2b38" stroke="#134e4a" stroke-width="1"/>
    <text x="40" y="165" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="17" font-weight="bold">2. Data Scientist / Analytics Lead</text>
    <text x="40" y="188" fill="#38bdf8" font-size="13" font-weight="600">Match Score: 89.2% • High Alignment</text>
    <text x="40" y="210" fill="#94a3b8" font-size="12">Next Steps: Statistical Inference, Advanced Plotly, A/B Testing</text>

    <!-- Match 3 -->
    <rect x="20" y="245" width="420" height="95" rx="10" fill="#0f2b38" stroke="#134e4a" stroke-width="1"/>
    <text x="40" y="275" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="17" font-weight="bold">3. Full-Stack Python Developer</text>
    <text x="40" y="298" fill="#a855f7" font-size="13" font-weight="600">Match Score: 84.8% • Solid Alignment</text>
    <text x="40" y="320" fill="#94a3b8" font-size="12">Next Steps: Microservices, Async Queues (Celery/Redis), PostgreSQL</text>
  </g>
</svg>
