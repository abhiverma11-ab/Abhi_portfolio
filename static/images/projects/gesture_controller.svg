<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="hand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <rect x="40" y="40" width="720" height="420" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
  <text x="70" y="80" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold">REAL-TIME HAND GESTURE CONTROLLER (OPENCV + MEDIAPIPE)</text>

  <!-- Camera HUD Window -->
  <rect x="70" y="110" width="400" height="300" rx="8" fill="#030712" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="138" fill="#ef4444" font-size="12" font-weight="bold">● LIVE WEBCAM FEED (60 FPS)</text>

  <!-- 21 MediaPipe Landmarks -->
  <g transform="translate(180, 160)">
    <!-- Palm & Fingers Skeleton -->
    <circle cx="100" cy="180" r="6" fill="#00f2fe"/>
    <circle cx="60" cy="120" r="5" fill="#00f2fe"/>
    <circle cx="40" cy="80" r="5" fill="#f59e0b"/>
    <circle cx="85" cy="60" r="5" fill="#f59e0b"/>
    <circle cx="120" cy="50" r="5" fill="#f59e0b"/>
    <circle cx="150" cy="70" r="5" fill="#f59e0b"/>
    <line x1="100" y1="180" x2="60" y2="120" stroke="#00f2fe" stroke-width="2"/>
    <line x1="60" y1="120" x2="40" y2="80" stroke="#00f2fe" stroke-width="2"/>
    <line x1="100" y1="180" x2="85" y2="60" stroke="#00f2fe" stroke-width="2"/>
    <line x1="100" y1="180" x2="120" y2="50" stroke="#00f2fe" stroke-width="2"/>
    <line x1="100" y1="180" x2="150" y2="70" stroke="#00f2fe" stroke-width="2"/>
  </g>

  <!-- Right: Gesture Mapping Control -->
  <g transform="translate(500, 110)">
    <rect width="230" height="300" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="20" y="35" fill="#f9fafb" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">Gesture Actions</text>

    <rect x="15" y="55" width="200" height="50" rx="6" fill="#1f2937"/>
    <text x="25" y="85" fill="#10b981" font-size="12" font-weight="bold">✌ Peace Sign: Next Slide</text>

    <rect x="15" y="115" width="200" height="50" rx="6" fill="#1f2937"/>
    <text x="25" y="145" fill="#3b82f6" font-size="12" font-weight="bold">👌 Pinch: Volume Slider</text>

    <rect x="15" y="175" width="200" height="50" rx="6" fill="#1f2937"/>
    <text x="25" y="205" fill="#f59e0b" font-size="12" font-weight="bold">☝ Index Point: Mouse Cursor</text>

    <rect x="15" y="235" width="200" height="50" rx="6" fill="#1f2937"/>
    <text x="25" y="265" fill="#ef4444" font-size="12" font-weight="bold">✊ Closed Fist: Mute Audio</text>
  </g>
</svg>
