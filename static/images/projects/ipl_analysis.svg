<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="chart-grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0.05)"/>
    </linearGradient>
    <linearGradient id="chart-grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="rgba(255, 0, 127, 0.05)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Dashboard Top Bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#152238" stroke="#243b55" stroke-width="1.5"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="130" y="60" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">IPL ANALYTICS DASHBOARD • 2008-2025 MATCH INTEL</text>
  <rect x="630" y="42" width="120" height="26" rx="6" fill="#00f2fe" opacity="0.15"/>
  <text x="690" y="59" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LIVE PREDICTOR</text>

  <!-- Left Stat Cards -->
  <g transform="translate(30, 100)">
    <rect width="220" height="110" rx="12" fill="#152238" stroke="url(#accent)" stroke-width="1"/>
    <text x="20" y="35" fill="#94a3b8" font-family="sans-serif" font-size="13">Strike Rate (Overs 16-20)</text>
    <text x="20" y="75" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="30" font-weight="bold">198.4 %</text>
    <text x="20" y="95" fill="#10b981" font-family="sans-serif" font-size="12">▲ +14.2% Impact Delta</text>
  </g>

  <g transform="translate(30, 230)">
    <rect width="220" height="110" rx="12" fill="#152238" stroke="#243b55" stroke-width="1"/>
    <text x="20" y="35" fill="#94a3b8" font-family="sans-serif" font-size="13">Win Prob After Toss (Bat 1st)</text>
    <text x="20" y="75" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="30" font-weight="bold">54.8 %</text>
    <text x="20" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12">Wankhede &amp; Chinnaswamy</text>
  </g>

  <g transform="translate(30, 360)">
    <rect width="220" height="100" rx="12" fill="#152238" stroke="#243b55" stroke-width="1"/>
    <text x="20" y="35" fill="#94a3b8" font-family="sans-serif" font-size="13">Economy Rate in Powerplay</text>
    <text x="20" y="72" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">6.82 rpo</text>
  </g>

  <!-- Right Big Interactive Chart -->
  <g transform="translate(280, 100)">
    <rect width="490" height="360" rx="12" fill="#152238" stroke="#243b55" stroke-width="1.5"/>
    <text x="25" y="40" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="18" font-weight="600">Head-to-Head Scoring Velocity &amp; Momentum Curves</text>
    <line x1="25" y1="60" x2="465" y2="60" stroke="#243b55" stroke-width="1"/>

    <!-- Chart Grid Lines -->
    <line x1="50" y1="120" x2="450" y2="120" stroke="#243b55" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="50" y1="180" x2="450" y2="180" stroke="#243b55" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="50" y1="240" x2="450" y2="240" stroke="#243b55" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="50" y1="300" x2="450" y2="300" stroke="#243b55" stroke-width="1"/>

    <!-- Plot Curves -->
    <path d="M 50 280 Q 150 220 250 160 T 450 90 L 450 300 L 50 300 Z" fill="url(#chart-grad1)"/>
    <path d="M 50 280 Q 150 220 250 160 T 450 90" fill="none" stroke="#00f2fe" stroke-width="3"/>

    <path d="M 50 290 Q 140 260 230 200 T 450 140 L 450 300 L 50 300 Z" fill="url(#chart-grad2)"/>
    <path d="M 50 290 Q 140 260 230 200 T 450 140" fill="none" stroke="#ff007f" stroke-width="3"/>

    <!-- Chart Legend -->
    <circle cx="280" cy="335" r="5" fill="#00f2fe"/>
    <text x="295" y="340" fill="#94a3b8" font-size="12">Team A Run Curve</text>
    <circle cx="390" cy="335" r="5" fill="#ff007f"/>
    <text x="405" y="340" fill="#94a3b8" font-size="12">Target Par Curve</text>
  </g>
</svg>
