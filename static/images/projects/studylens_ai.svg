<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="130" y="60" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">STUDYLENS AI • CONTEXTUAL RAG DOCUMENT ASSISTANT</text>
  <rect x="630" y="42" width="120" height="26" rx="6" fill="#8b5cf6" opacity="0.25"/>
  <text x="690" y="59" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LLM ACTIVE</text>

  <!-- Left: Uploaded Documents Panel -->
  <g transform="translate(30, 100)">
    <rect width="230" height="360" rx="12" fill="#131427" stroke="#312e81" stroke-width="1"/>
    <text x="20" y="35" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">Uploaded Sources (4)</text>
    
    <!-- Doc 1 -->
    <rect x="15" y="55" width="200" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="30" y="80" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">📄 Deep_Learning_Ch4.pdf</text>
    <text x="30" y="100" fill="#a855f7" font-size="11">Indexed: 142 Chunks</text>

    <!-- Doc 2 -->
    <rect x="15" y="125" width="200" height="60" rx="8" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="30" y="150" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">📊 ML_Lecture_Notes.pptx</text>
    <text x="30" y="170" fill="#94a3b8" font-size="11">Indexed: 68 Slides</text>

    <!-- Doc 3 -->
    <rect x="15" y="195" width="200" height="60" rx="8" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="30" y="220" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">📑 Attention_Paper.pdf</text>
    <text x="30" y="240" fill="#94a3b8" font-size="11">Indexed: 95 Chunks</text>

    <!-- Quick Stats -->
    <rect x="15" y="275" width="200" height="70" rx="8" fill="rgba(139, 92, 246, 0.1)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="25" y="300" fill="#c084fc" font-size="12" font-weight="bold">⚡ Vector Similarity</text>
    <text x="25" y="325" fill="#38bdf8" font-size="16" font-weight="bold">Cosine Metric (0.942)</text>
  </g>

  <!-- Right: RAG Q&A Chat Window -->
  <g transform="translate(280, 100)">
    <rect width="490" height="360" rx="12" fill="#131427" stroke="#312e81" stroke-width="1.5"/>

    <!-- User Question Bubble -->
    <rect x="140" y="25" width="325" height="55" rx="12" fill="#312e81"/>
    <text x="160" y="48" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="500">"Explain Self-Attention mechanism with formula"</text>
    <text x="160" y="68" fill="#a5b4fc" font-size="11">Student Query • 10:42 AM</text>

    <!-- AI Response Bubble -->
    <rect x="25" y="95" width="440" height="175" rx="12" fill="#1e1b4b" stroke="url(#ai-glow)" stroke-width="1.5"/>
    <text x="45" y="125" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">✨ StudyLens AI Response (Cited from Page 4, Eq 1):</text>
    <text x="45" y="152" fill="#e2e8f0" font-family="sans-serif" font-size="13">Self-attention computes dynamic weights across input tokens:</text>
    <rect x="45" y="165" width="400" height="40" rx="6" fill="#0f172a"/>
    <text x="60" y="190" fill="#38bdf8" font-family="monospace" font-size="14">Attention(Q, K, V) = softmax(Q * K^T / √d_k) * V</text>
    
    <text x="45" y="225" fill="#94a3b8" font-size="12">Key insight: Allows tokens to attend to contextual relationships.</text>
    <rect x="45" y="238" width="130" height="22" rx="4" fill="#6366f1" opacity="0.3"/>
    <text x="55" y="253" fill="#a5b4fc" font-size="11">Citation: Attention_Paper.pdf:P4</text>

    <!-- Chat Input Box -->
    <rect x="25" y="290" width="440" height="50" rx="10" fill="#0f172a" stroke="#312e81" stroke-width="1"/>
    <text x="45" y="320" fill="#64748b" font-family="sans-serif" font-size="13">Ask any follow-up question or generate flashcards...</text>
    <circle cx="435" cy="315" r="16" fill="url(#ai-glow)"/>
    <polygon points="430,310 442,315 430,320" fill="#ffffff"/>
  </g>
</svg>
